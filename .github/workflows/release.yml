name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test release commit
        run: |
          go test ./...
          go vet ./...
          sh -n scripts/*.sh build/wslan-entrypoint.sh

  images:
    name: Build ${{ matrix.component }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: controller
            dockerfile: build/controller.Dockerfile
          - component: worker
            dockerfile: build/worker.Dockerfile
          - component: wslan
            dockerfile: build/wslan.Dockerfile
    steps:
      - uses: actions/checkout@v6
      - name: Resolve image name
        id: image
        shell: bash
        run: |
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.component }}
        id: build
        uses: docker/build-push-action@cb941d0b895b09c17fa011d41c411b33c752cf28
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.image.outputs.repository }}-${{ matrix.component }}:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Attest ${{ matrix.component }} image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ steps.image.outputs.repository }}-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Build release assets
        shell: bash
        run: |
          ./scripts/release.sh "$GITHUB_REF_NAME" dist
          cp deploy/compose.yaml dist/compose.yaml
          sed \
            -e "s|@GITHUB_REPOSITORY@|$GITHUB_REPOSITORY|g" \
            -e "s|@RELEASE_VERSION@|$GITHUB_REF_NAME|g" \
            scripts/setup.sh >dist/setup.sh
          sed \
            -e "s|@GITHUB_REPOSITORY@|$GITHUB_REPOSITORY|g" \
            -e "s|@RELEASE_VERSION@|$GITHUB_REF_NAME|g" \
            scripts/bootstrap.sh >dist/bootstrap.sh
          sed "s|@GITHUB_REPOSITORY@|$GITHUB_REPOSITORY|g" \
            scripts/install.sh >dist/install.sh
          sed "s|@GITHUB_REPOSITORY@|$GITHUB_REPOSITORY|g" \
            scripts/update.sh >dist/update.sh
          chmod 755 dist/bootstrap.sh dist/setup.sh dist/update.sh dist/install.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/workstation-manager-bundle.tar.gz \
            dist/workstation-manager-bundle.tar.gz.sha256 \
            dist/compose.yaml \
            dist/bootstrap.sh \
            dist/setup.sh \
            dist/update.sh \
            dist/install.sh \
            --verify-tag \
            --generate-notes \
            --title "Workstation Manager $GITHUB_REF_NAME"
