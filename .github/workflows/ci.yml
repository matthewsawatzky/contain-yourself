name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l cmd internal pkg web)"
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Validate app store
        run: make store-check
      - name: Validate shell scripts
        run: |
          sh -n scripts/*.sh build/wslan-entrypoint.sh dev
          test -x dev
          test -x scripts/bootstrap.sh
          test -x scripts/install.sh
          test -x scripts/manage.sh
          test -x scripts/release.sh
          test -x scripts/update.sh
      - name: Validate development Compose file
        run: docker compose --env-file .env.example config --quiet
      - name: Build release bundle
        run: ./scripts/release.sh v0.0.0 dist
      - name: Validate standalone setup
        shell: bash
        run: |
          project=$(mktemp -d)
          cp deploy/compose.yaml "$project/compose.yaml"
          sed \
            -e 's|@GITHUB_REPOSITORY@|example/contain-yourself|g' \
            -e 's|@RELEASE_VERSION@|v0.0.0|g' \
            scripts/setup.sh >"$project/setup.sh"
          chmod 755 "$project/setup.sh"
          "$project/setup.sh" \
            --directory "$project" \
            --bundle "$PWD/dist/workstation-manager-bundle.tar.gz"
          test -f "$project/.env"
          test -d "$project/config/apps"
          test -d "$project/config/templates"
          test -d "$project/data/worker"
          test -d "$project/data/workstation-logs"
          docker compose \
            --project-directory "$project" \
            --env-file "$project/.env" \
            -f "$project/compose.yaml" config --quiet
      - name: Validate bootstrap installer
        shell: bash
        run: |
          assets=$(mktemp -d)
          project=$(mktemp -d)
          cp deploy/compose.yaml "$assets/compose.yaml"
          cp dist/workstation-manager-bundle.tar.gz* "$assets/"
          sed \
            -e 's|@GITHUB_REPOSITORY@|example/contain-yourself|g' \
            -e 's|@RELEASE_VERSION@|v0.0.0|g' \
            scripts/setup.sh >"$assets/setup.sh"
          sed \
            -e 's|@GITHUB_REPOSITORY@|example/contain-yourself|g' \
            -e 's|@RELEASE_VERSION@|v0.0.0|g' \
            scripts/bootstrap.sh >"$assets/bootstrap.sh"
          sed 's|@GITHUB_REPOSITORY@|example/contain-yourself|g' \
            scripts/update.sh >"$assets/update.sh"
          chmod 755 "$assets/setup.sh" "$assets/bootstrap.sh" "$assets/update.sh"
          WM_RELEASE_BASE_URL="file://$assets" \
            "$assets/bootstrap.sh" --directory "$project"
          test -f "$project/compose.yaml"
          test -x "$project/setup.sh"
          test -x "$project/update.sh"
          test -f "$project/.env"
          test -d "$project/config/apps"
          test -d "$project/data/worker"
          test -d "$project/data/workstation-logs"
          WM_RELEASE_BASE_URL="file://$assets" \
            "$project/update.sh" --directory "$project"
          test -z "$(docker compose -f "$project/compose.yaml" ps --status running -q)"
      - name: Validate release Compose file
        run: |
          WM_IMAGE_REPOSITORY=ghcr.io/example/workstation-manager \
          WM_VERSION=v0.0.0 \
          CONTROLLER_UID=1000 \
          CONTROLLER_GID=1000 \
          DATA_DIRECTORY=/tmp/workstation-manager-data \
          CONFIG_DIRECTORY=/tmp/workstation-manager-config \
          WORKER_TOKEN=ci-worker-token-0123456789abcdef \
          docker compose -f deploy/compose.yaml config --quiet
