schema_version: 1
id: files
name: Files
version: 2.0.0
description: Workspace file browser with image and video preview
runtime:
  type: container-service
  image: ghcr.io/matthewsawatzky/contain-yourself-files:v0.6.0
  environment:
    TZ: Etc/UTC
  internal_port: 7080
routing:
  base_path: /apps/files/
  strip_prefix: false
  websocket: false
network:
  mode: workstation-vpn
storage:
  - type: workspace
    target: /workspace
    owner_uid: 10001
    owner_gid: 10001
resources:
  default_memory_mb: 128
  default_cpu: 0.25
health:
  type: http
  path: /apps/files/healthz
  timeout_seconds: 5
desktop:
  visible: true
  icon: icon.svg
  default_width: 1000
  default_height: 700
  singleton: true
