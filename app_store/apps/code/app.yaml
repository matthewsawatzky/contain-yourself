schema_version: 1
id: code
name: Code
version: 1.1.0
description: Browser-accessible code editor
runtime:
  type: container-service
  image: codercom/code-server:4.99.4
  command: ["--bind-addr", "0.0.0.0:8082", "--auth", "none", "--disable-telemetry", "--disable-update-check", "/workspace"]
  internal_port: 8082
routing:
  base_path: /apps/code/
  strip_prefix: true
  websocket: true
network:
  mode: workstation-vpn
storage:
  - type: workspace
    target: /workspace
    owner_uid: 1000
    owner_gid: 1000
  - type: app-data
    target: /home/coder/.local/share/code-server
    owner_uid: 1000
    owner_gid: 1000
resources:
  default_memory_mb: 1024
  default_cpu: 1
health:
  type: http
  path: /healthz
  timeout_seconds: 10
desktop:
  visible: true
  icon: icon.svg
  default_width: 1200
  default_height: 760
  singleton: true
