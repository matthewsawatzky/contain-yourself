schema_version: 1
id: files
name: Files
version: 1.1.0
description: Workspace-scoped file manager
runtime:
  type: container-service
  image: filebrowser/filebrowser:v2.32.0
  command: ["--address", "0.0.0.0", "--port", "8081", "--root", "/workspace", "--baseurl", "/apps/files", "--database", "/database/filebrowser.db", "--noauth"]
  internal_port: 8081
routing:
  base_path: /apps/files/
  strip_prefix: false
  websocket: false
network:
  mode: workstation-vpn
storage:
  - type: workspace
    target: /workspace
  - type: app-data
    target: /database
resources:
  default_memory_mb: 256
  default_cpu: 0.25
health:
  type: http
  path: /apps/files/health
  timeout_seconds: 5
desktop:
  visible: true
  icon: icon.svg
  default_width: 1000
  default_height: 700
  singleton: true
